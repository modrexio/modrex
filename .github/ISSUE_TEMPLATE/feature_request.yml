name: Feature Request
description: Suggest a new feature or improvement
labels: [feature]
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem does this solve?
          placeholder: Describe what you're trying to do that currently isn't possible or is inconvenient.
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          placeholder: Describe what you'd like to see added or changed.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          placeholder: Any workarounds you've tried or other approaches that could work.
