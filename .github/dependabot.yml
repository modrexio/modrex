version: 2

updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      labels:
          - dependencies
      ignore:
          - dependency-name: typescript
            update-types:
                - version-update:semver-major
      groups:
          npm-all:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    - package-ecosystem: cargo
      directory: /apps/desktop/src-tauri
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      labels:
          - dependencies
      # repak's PakBuilder::key takes the aes major it depends on.
      ignore:
          - dependency-name: aes
            update-types:
                - version-update:semver-major
          # tauri-plugin-deep-link 2.6.2 does not compile against rust-ini 0.21.3, and
          # single-instance 2.5.4 requires it.
          - dependency-name: tauri-plugin-deep-link
            versions:
                - 2.6.2
          - dependency-name: tauri-plugin-single-instance
            versions:
                - 2.5.4
      groups:
          cargo-all:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      labels:
          - dependencies
      groups:
          actions-all:
              patterns:
                  - '*'

    - package-ecosystem: rust-toolchain
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: chore(deps)
      labels:
          - dependencies
