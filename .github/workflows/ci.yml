name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'

jobs:
    index:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm index:test

    site:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm site:typecheck
            - run: pnpm site:typecheck:functions
            - run: pnpm site:lint
            - run: pnpm site:format:check
            - run: pnpm site:test
            - run: pnpm site:build

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check-version
            - run: pnpm check-commands
            - run: pnpm check-csp
            - run: pnpm check-games
            - run: pnpm check-sources
            - run: pnpm check-updater
            - run: pnpm typecheck
            - run: cargo clippy --all-targets -- -D warnings
              working-directory: apps/desktop/src-tauri
            - run: pnpm test

            # cargo test just regenerated apps/desktop/src/shared/bindings.ts from the command
            # registry; a diff means the committed bindings are stale.
            - name: Fail if generated bindings are stale
              run: git diff --exit-code apps/desktop/src/shared/bindings.ts

    check-licenses:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Cache cargo-about
              id: cache-cargo-about
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-about
                  key: cargo-about-${{ runner.os }}-v0.9.0

            - name: Install cargo-about
              if: steps.cache-cargo-about.outputs.cache-hit != 'true'
              run: cargo install cargo-about --features=cli

            - run: pnpm generate-licenses

            - name: Fail if desktop third-party licenses are stale
              run: git diff --exit-code apps/desktop/THIRD_PARTY_LICENSES.md

    security-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Audit npm dependencies
              run: pnpm audit

            - name: Cache cargo-audit
              id: cache-cargo-audit
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-audit
                  key: cargo-audit-${{ runner.os }}

            - name: Install cargo-audit
              if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
              run: cargo install cargo-audit --locked

            - name: Audit Rust dependencies
              working-directory: apps/desktop/src-tauri
              run: cargo audit
