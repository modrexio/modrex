name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '17 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: read
        outputs:
            rust: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.rust == 'true' }}
            renderer: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.renderer == 'true' || steps.filter.outputs.js == 'true' }}
            tooling: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.tooling == 'true' || steps.filter.outputs.js == 'true' }}
            site: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.site == 'true' || steps.filter.outputs.js == 'true' }}
            index: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.index == 'true' || steps.filter.outputs.js == 'true' }}
            licenses: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.licenses == 'true' || steps.filter.outputs.js == 'true' }}
        steps:
            - uses: actions/checkout@v7
              if: github.event_name == 'push'

            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
              if: github.event_name == 'push' || github.event_name == 'pull_request'
              id: filter
              with:
                  base: ${{ github.event_name == 'push' && github.event.before || '' }}
                  ref: ${{ github.event_name == 'push' && github.sha || '' }}
                  predicate-quantifier: some-with-excludes
                  filters: |
                      global:
                          - '**'
                          - '!apps/desktop/**'
                          - '!apps/site/**'
                          - '!apps/index/**'
                          - '!packages/games/**'
                          - '!packages/scrollbars/**'
                          - '!functions/**'
                          - '!docs/**'
                          - '!assets/i18n/**'
                          - '!README.md'
                          - '!LICENSE'
                          - '!CHANGELOG.md'
                          - '!AGENTS.md'
                          - '!CLAUDE.md'
                          - '!CONTRIBUTING.md'
                          - '!SECURITY.md'
                          - '!.agents/**'
                          - '!.claude/**'
                          - '!.codex/**'
                          - '!.github/workflows/**'
                          - '!.github/dependabot.yml'
                          - '!bun.lock'
                          - '!bunfig.toml'
                          - '!install.config.json'
                      workflow:
                          - '.github/workflows/ci.yml'
                      js:
                          - 'bun.lock'
                          - 'bunfig.toml'
                      rust:
                          - 'apps/desktop/src-tauri/**'
                          - 'apps/desktop/src/shared/bindings.ts'
                          - 'apps/desktop/THIRD_PARTY_LICENSES.md'
                          - 'apps/index/marker-contract.json'
                          - 'packages/games/**'
                          - 'docs/reference/**'
                          - 'LICENSE'
                      renderer:
                          - 'apps/desktop/**'
                          - '!apps/desktop/src-tauri/**'
                          - '!apps/desktop/scripts/**'
                          - '!apps/desktop/THIRD_PARTY_LICENSES.md'
                          - '!apps/desktop/AGENTS.md'
                          - '!apps/desktop/CLAUDE.md'
                          - '!apps/desktop/translation-contributors.generated.json'
                          - 'packages/games/**'
                          - 'packages/scrollbars/**'
                          - 'functions/**'
                      tooling:
                          - 'apps/desktop/scripts/**'
                          - 'apps/desktop/src/shared/**'
                          - 'apps/desktop/src/renderer/src/i18n/**'
                          - 'apps/desktop/translation-contributors.generated.json'
                          - 'apps/desktop/package.json'
                          - 'apps/desktop/tsconfig*.json'
                          - 'assets/i18n/**'
                          - '.husky/**'
                          - '.github/workflows/translation-status.yml'
                          - 'README.md'
                      site:
                          - 'apps/site/**'
                          - 'packages/games/**'
                          - 'packages/scrollbars/**'
                          - 'install.config.json'
                      index:
                          - 'apps/index/**'
                          - 'packages/games/**'
                          - '.github/workflows/*postgres*.yml'
                      licenses:
                          - '**/Cargo.toml'
                          - '**/Cargo.lock'
                          - 'apps/desktop/package.json'
                          - 'packages/games/package.json'
                          - 'packages/scrollbars/package.json'
                          - 'packages/games/[Ll][Ii][Cc][Ee][Nn][SsCc][Ee]*'
                          - 'packages/scrollbars/[Ll][Ii][Cc][Ee][Nn][SsCc][Ee]*'
                          - 'apps/desktop/[Ll][Ii][Cc][Ee][Nn][SsCc][Ee]*'
                          - 'apps/desktop/scripts/generate-licenses.mts'
                          - 'apps/desktop/THIRD_PARTY_LICENSES.md'
                          - 'apps/desktop/src-tauri/about.toml'
                          - 'apps/desktop/src-tauri/about.hbs'
                          - 'apps/desktop/src-tauri/.cargo/**'
                          - 'LICENSE'

            - id: full
              env:
                  FULL: ${{ (github.event_name != 'push' && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 3000) || steps.filter.outputs.global == 'true' || steps.filter.outputs.workflow == 'true' }}
              run: echo "full=$FULL" >> "$GITHUB_OUTPUT"

    checks:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run check-version
            - run: bun run check-overrides
            - run: bun run check-commands
            - run: bun run check-csp
            - run: bun run check-updater
            - run: bun run check-i18n
            - name: i18n read-only check
              run: bun run i18n:check-readonly
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck

    rust-linux:
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - run: rustup install --no-self-update
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
              with:
                  workspaces: apps/desktop/src-tauri
                  shared-key: ci-ubuntu-24.04-v1
                  cache-bin: false
                  save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

            - run: cargo clippy --locked --workspace --all-targets -- -D warnings
              working-directory: apps/desktop/src-tauri
            - run: cargo check --locked --release --workspace --lib --bins
              working-directory: apps/desktop/src-tauri
            - run: cargo test --locked --workspace
              working-directory: apps/desktop/src-tauri

            # The export tests regenerate these committed artifacts even on a cache hit.
            - name: Fail if generated bindings are stale
              run: git diff --exit-code -- apps/desktop/src/shared/bindings.ts
            - name: Fail if the generated game catalogue is stale
              run: git diff --exit-code -- packages/games/catalog.generated.ts
            - name: Fail if the generated package reference is stale
              run: git diff --exit-code -- docs/reference/game-package.md

    rust-windows:
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: windows-2025
        strategy:
            fail-fast: false
            matrix:
                lane: [lint, test]
        steps:
            - uses: actions/checkout@v7

            - name: Put Cargo home on D
              shell: pwsh
              run: |
                  $cargoHome = 'D:\cargo-home'
                  New-Item -ItemType Directory -Force $cargoHome | Out-Null
                  Copy-Item (Join-Path $env:USERPROFILE '.cargo\*') $cargoHome -Recurse -Force
                  "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
                  "$cargoHome\bin" >> $env:GITHUB_PATH

            - run: rustup install --no-self-update

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
              with:
                  workspaces: apps/desktop/src-tauri
                  shared-key: ci-windows-2025-${{ matrix.lane }}-v2
                  cache-bin: false
                  save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

            - if: matrix.lane == 'lint'
              run: cargo clippy --locked --workspace --all-targets -- -D warnings
              working-directory: apps/desktop/src-tauri
            - if: matrix.lane == 'lint'
              run: cargo check --locked --release --workspace --lib --bins
              working-directory: apps/desktop/src-tauri
            - if: matrix.lane == 'test'
              run: cargo test --locked --workspace
              working-directory: apps/desktop/src-tauri

    renderer:
        needs: changes
        if: needs.changes.outputs.renderer == 'true'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run test:renderer
            - run: bun run --cwd apps/desktop test:preview

    tooling:
        needs: changes
        if: needs.changes.outputs.tooling == 'true'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run --cwd apps/desktop test:scripts

    site:
        needs: changes
        if: needs.changes.outputs.site == 'true'
        runs-on: ubuntu-24.04
        steps:
            # Legal dates are checked against the commits that changed each page.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run site:check-legal-dates
            - run: bun run site:test
            - run: bun run site:build
              env:
                  GITHUB_TOKEN: ${{ github.token }}

    index:
        needs: changes
        if: needs.changes.outputs.index == 'true'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Install pinned 7-Zip
              run: bash apps/index/scripts/install-7zip.sh
            - run: bun run index:test

    check-licenses:
        needs: changes
        if: needs.changes.outputs.licenses == 'true'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: rustup install --no-self-update

            - name: Cache cargo-about
              id: cache-cargo-about
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-about
                  key: cargo-about-${{ runner.os }}-${{ runner.arch }}-0.9.0-v2

            - name: Install cargo-about
              if: steps.cache-cargo-about.outputs.cache-hit != 'true'
              run: cargo install cargo-about --version 0.9.0 --locked --features=cli

            - run: bun run generate-licenses
            - name: Fail if desktop third-party licenses are stale
              run: git diff --exit-code -- apps/desktop/THIRD_PARTY_LICENSES.md
