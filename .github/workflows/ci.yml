name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check-commands
            - run: pnpm typecheck
            - run: pnpm test

    check-licenses:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Cache cargo-about
              id: cache-cargo-about
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-about
                  key: cargo-about-${{ runner.os }}-v0.9.0

            - name: Install cargo-about
              if: steps.cache-cargo-about.outputs.cache-hit != 'true'
              run: cargo install cargo-about --features=cli

            - run: pnpm generate-licenses

            - name: Fail if THIRD_PARTY_LICENSES.md is stale
              run: git diff --exit-code THIRD_PARTY_LICENSES.md
