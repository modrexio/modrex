name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'

permissions:
    contents: read

jobs:
    index:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run index:test

    site:
        runs-on: ubuntu-latest
        steps:
            # Full history: check-legal-dates compares each legal page against the commit
            # that last touched it, which a shallow clone cannot answer.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run site:typecheck
            - run: bun run site:typecheck:functions
            - run: bun run site:check-legal-dates
            - run: bun run site:lint
            - run: bun run site:format:check
            - run: bun run site:test
            - run: bun run site:build

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run check-version
            - run: bun run check-commands
            - run: bun run check-csp
            - run: bun run check-updater
            - run: bun run check-i18n
            - name: i18n read-only check
              run: bun run i18n:check-readonly
            - run: bun run typecheck
            - run: cargo clippy --workspace --all-targets -- -D warnings
              working-directory: apps/desktop/src-tauri
            - run: bun run test

            # cargo test just regenerated apps/desktop/src/shared/bindings.ts from the command
            # registry; a diff means the committed bindings are stale.
            - name: Fail if generated bindings are stale
              run: git diff --exit-code apps/desktop/src/shared/bindings.ts

            # Same test run regenerated the frontend game catalogue from the Rust packages.
            - name: Fail if the generated game catalogue is stale
              run: git diff --exit-code packages/games/catalog.generated.ts

            # And the contributor reference, which is rendered from the package contract.
            - name: Fail if the generated package reference is stale
              run: git diff --exit-code docs/reference/game-package.md

    check-licenses:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile

            - name: Cache cargo-about
              id: cache-cargo-about
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-about
                  key: cargo-about-${{ runner.os }}-v0.9.0

            - name: Install cargo-about
              if: steps.cache-cargo-about.outputs.cache-hit != 'true'
              run: cargo install cargo-about --features=cli

            - run: bun run generate-licenses

            - name: Fail if desktop third-party licenses are stale
              run: git diff --exit-code apps/desktop/THIRD_PARTY_LICENSES.md

    security-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile

            - name: Audit npm dependencies
              run: bun run audit:deps

            - name: Cache cargo-audit
              id: cache-cargo-audit
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-audit
                  key: cargo-audit-${{ runner.os }}

            - name: Install cargo-audit
              if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
              run: cargo install cargo-audit --locked

            - name: Audit Rust dependencies
              working-directory: apps/desktop/src-tauri
              run: cargo audit
