name: CodeQL

on:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**.md'
            - '.gitignore'
            - 'LICENSE'
    schedule:
        - cron: '30 4 * * 1'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                language: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["javascript-typescript", "rust"]' || '["javascript-typescript"]') }}
        steps:
            - uses: actions/checkout@v7

            - uses: github/codeql-action/init@v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            - uses: github/codeql-action/analyze@v4.39.1
              with:
                  category: '/language:${{ matrix.language }}'
                  upload-database: ${{ github.event_name == 'schedule' }}
