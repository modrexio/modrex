name: Update Dependabot licenses

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]
        paths:
            - apps/desktop/package.json
            - pnpm-lock.yaml
            - apps/desktop/src-tauri/Cargo.toml
            - apps/desktop/src-tauri/Cargo.lock

concurrency:
    group: dependabot-licenses-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    generate:
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            licenses-changed: ${{ steps.licenses.outputs.changed }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Cache cargo-about
              id: cache-cargo-about
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-about
                  key: cargo-about-${{ runner.os }}-v0.9.0

            - name: Install cargo-about
              if: steps.cache-cargo-about.outputs.cache-hit != 'true'
              run: cargo install cargo-about --features=cli

            - run: pnpm generate-licenses

            - name: Check generated licenses
              id: licenses
              run: |
                  if git diff --quiet -- apps/desktop/THIRD_PARTY_LICENSES.md; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/upload-artifact@v7
              if: steps.licenses.outputs.changed == 'true'
              with:
                  name: third-party-licenses
                  path: apps/desktop/THIRD_PARTY_LICENSES.md
                  if-no-files-found: error
                  retention-days: 1

    commit:
        needs: generate
        if: needs.generate.outputs.licenses-changed == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Require push token
              env:
                  DEPENDABOT_PR_TOKEN: ${{ secrets.DEPENDABOT_PR_TOKEN }}
              run: |
                  if [ -z "$DEPENDABOT_PR_TOKEN" ]; then
                    echo "::error::Add DEPENDABOT_PR_TOKEN as a Dependabot repository secret"
                    exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  token: ${{ secrets.DEPENDABOT_PR_TOKEN }}

            - uses: actions/download-artifact@v8
              with:
                  name: third-party-licenses
                  path: .generated

            - name: Commit updated licenses
              env:
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  cp .generated/THIRD_PARTY_LICENSES.md apps/desktop/THIRD_PARTY_LICENSES.md

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add apps/desktop/THIRD_PARTY_LICENSES.md
                  git commit -m "chore(deps): regenerate third-party licenses" -m "[dependabot skip]"
                  git push origin "HEAD:$HEAD_REF"
