name: Sync Dependabot lockfile and licenses

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]
        paths:
            - '**/package.json'
            - bun.lock
            - apps/desktop/src-tauri/Cargo.toml
            - apps/desktop/src-tauri/Cargo.lock

concurrency:
    group: dependabot-sync-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    generate:
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            changed: ${{ steps.generated.outputs.changed }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - run: rustup install --no-self-update

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            # Security updates edit a workspace package.json and leave bun.lock stale.
            - run: bun install
            - run: bun run check-overrides

            - name: Cache cargo-about
              id: cache-cargo-about
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/cargo-about
                  key: cargo-about-${{ runner.os }}-${{ runner.arch }}-0.9.0-v2

            - name: Install cargo-about
              if: steps.cache-cargo-about.outputs.cache-hit != 'true'
              run: cargo install cargo-about --version 0.9.0 --locked --features=cli

            - run: bun run generate-licenses

            - name: Check generated files
              id: generated
              run: |
                  if git diff --quiet -- bun.lock apps/desktop/THIRD_PARTY_LICENSES.md; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/upload-artifact@v7
              if: steps.generated.outputs.changed == 'true'
              with:
                  name: dependabot-sync
                  path: |
                      bun.lock
                      apps/desktop/THIRD_PARTY_LICENSES.md
                  if-no-files-found: error
                  retention-days: 1

    commit:
        needs: generate
        if: needs.generate.outputs.changed == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Require push token
              env:
                  DEPENDABOT_PR_TOKEN: ${{ secrets.DEPENDABOT_PR_TOKEN }}
              run: |
                  if [ -z "$DEPENDABOT_PR_TOKEN" ]; then
                    echo "::error::Add DEPENDABOT_PR_TOKEN as a Dependabot repository secret"
                    exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  token: ${{ secrets.DEPENDABOT_PR_TOKEN }}

            - uses: actions/download-artifact@v8
              with:
                  name: dependabot-sync
                  path: .generated

            - name: Commit synced files
              env:
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  cp .generated/bun.lock bun.lock
                  cp .generated/apps/desktop/THIRD_PARTY_LICENSES.md apps/desktop/THIRD_PARTY_LICENSES.md

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add bun.lock apps/desktop/THIRD_PARTY_LICENSES.md
                  git commit -m "chore(deps): sync bun.lock and third-party licenses" -m "[dependabot skip]"
                  git push origin "HEAD:$HEAD_REF"
