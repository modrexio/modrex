name: Dependency graph

on:
    push:
        branches: [main]
        paths:
            - bun.lock
            - .github/scripts/bun-lock-snapshot.mts
            - .github/workflows/dependency-graph.yml
    workflow_dispatch:

permissions:
    contents: read

# Snapshots replace each other in submission order, so runs must not overlap and every run,
# including a rerun of an old one, submits the current main.
concurrency:
    group: dependency-graph
    cancel-in-progress: false

jobs:
    submit-bun-lock:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - run: GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF=refs/heads/main bun .github/scripts/bun-lock-snapshot.mts > snapshot.json

            - name: Submit snapshot
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input snapshot.json
