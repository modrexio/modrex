name: Desktop build

on:
    workflow_call:
        inputs:
            ref:
                description: 'Commit to build'
                required: true
                type: string
            version:
                description: 'Version to stamp into the build'
                required: true
                type: string

cache-mode: none

jobs:
    build-windows:
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - run: rustup install --no-self-update

            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - name: Install artifact-signing-cli 0.11.0
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $signerDir = Join-Path $env:RUNNER_TEMP 'artifact-signing-cli'
                  New-Item -ItemType Directory -Force $signerDir | Out-Null
                  $signerExe = Join-Path $signerDir 'artifact-signing-cli.exe'
                  Invoke-WebRequest 'https://github.com/Levminer/artifact-signing-cli/releases/download/0.11.0/artifact-signing-cli.exe' -OutFile $signerExe
                  $signerHash = (Get-FileHash $signerExe -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($signerHash -ne 'ddc6f6ef68631bf367ad051d7d37109e58d46095406e1fbba60d553b10f94393') {
                      throw "artifact-signing-cli hash mismatch: $signerHash"
                  }
                  Add-Content -Path $env:GITHUB_PATH -Value $signerDir
            - name: Stamp version
              working-directory: apps/desktop
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  bun scripts/stamp-version.mts "$VERSION"
                  bun scripts/check-version.mts

            - run: bun run build:signed --bundles nsis
              env:
                  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
                  MODREX_GA_MEASUREMENT_ID: ${{ secrets.MODREX_GA_MEASUREMENT_ID }}

            - name: Verify Authenticode signature
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $installer = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe'
                  $signature = Get-AuthenticodeSignature $installer.FullName
                  if ($signature.Status -ne 'Valid') {
                      throw "Installer signature is $($signature.Status): $($signature.StatusMessage)"
                  }
                  Write-Host "Signed by $($signature.SignerCertificate.Subject)"

            - name: Smoke-test NSIS installer
              shell: pwsh
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $expectedVersion = $env:VERSION
                  $installDir = Join-Path $env:RUNNER_TEMP 'modrex-nsis-smoke'
                  $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Modrex'
                  $installers = @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe')

                  if ($installers.Count -ne 1) {
                      throw "Expected one NSIS installer, found $($installers.Count)"
                  }

                  $installer = $installers[0]
                  if ($installer.VersionInfo.ProductVersion -ne $expectedVersion) {
                      throw "Installer version is $($installer.VersionInfo.ProductVersion), expected $expectedVersion"
                  }

                  try {
                      foreach ($attempt in 'fresh install', 'reinstall') {
                          $process = Start-Process $installer.FullName `
                            -ArgumentList '/S', "/D=$installDir" `
                            -Wait -PassThru
                          if ($process.ExitCode -ne 0) {
                              throw "NSIS $attempt failed with exit code $($process.ExitCode)"
                          }
                      }

                      $executable = Join-Path $installDir 'modrex.exe'
                      $uninstaller = Join-Path $installDir 'uninstall.exe'
                      if (!(Test-Path -LiteralPath $executable)) {
                          throw 'Installed executable was not created'
                      }
                      if (!(Test-Path -LiteralPath $uninstaller)) {
                          throw 'NSIS uninstaller was not created'
                      }

                      $installedVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
                      if ($installedVersion -ne $expectedVersion) {
                          throw "Installed version is $installedVersion, expected $expectedVersion"
                      }

                      $registration = Get-ItemProperty $uninstallKey
                      if ($registration.DisplayName -ne 'Modrex') {
                          throw "Registered display name is $($registration.DisplayName), expected Modrex"
                      }
                      if ($registration.DisplayVersion -ne $expectedVersion) {
                          throw "Registered version is $($registration.DisplayVersion), expected $expectedVersion"
                      }
                      if ($registration.Publisher -ne 'modrex') {
                          throw "Registered publisher is $($registration.Publisher), expected modrex"
                      }
                      if ($registration.InstallLocation.Trim('"') -ne $installDir) {
                          throw "Registered install location is $($registration.InstallLocation), expected $installDir"
                      }

                      $process = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
                      if ($process.ExitCode -ne 0) {
                          throw "NSIS uninstall failed with exit code $($process.ExitCode)"
                      }

                      for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $installDir); $i++) {
                          Start-Sleep -Milliseconds 250
                      }
                      if (Test-Path -LiteralPath $installDir) {
                          throw 'Silent uninstall left the installation directory behind'
                      }
                      if (Test-Path $uninstallKey) {
                          throw 'Silent uninstall left the uninstall registration behind'
                      }
                  } finally {
                      $uninstaller = Join-Path $installDir 'uninstall.exe'
                      if (Test-Path -LiteralPath $uninstaller) {
                          Start-Process $uninstaller -ArgumentList '/S' -Wait
                      }
                      if (Test-Path -LiteralPath $installDir) {
                          Remove-Item -LiteralPath $installDir -Recurse -Force
                      }
                      if (Test-Path $uninstallKey) {
                          Remove-Item $uninstallKey -Recurse -Force
                      }
                  }

            - name: Sign updater artifact
              working-directory: apps/desktop
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  INSTALLERS=("$PWD"/src-tauri/target/release/bundle/nsis/*.exe)
                  if (( ${#INSTALLERS[@]} != 1 )); then
                    echo "Expected one NSIS installer, found ${#INSTALLERS[@]}" >&2
                    exit 1
                  fi
                  bun --bun run tauri signer sign --app-version "$VERSION" "${INSTALLERS[0]}"

            - uses: actions/upload-artifact@v7
              with:
                  name: windows-nsis
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
                      apps/desktop/src-tauri/target/release/bundle/nsis/*.sig

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    rpm \
                    cpio \
                    minisign

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - run: rustup install --no-self-update

            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test
            - name: Stamp version
              working-directory: apps/desktop
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  bun scripts/stamp-version.mts "$VERSION"
                  bun scripts/check-version.mts

            - run: bun run build:signed --bundles deb,appimage
              env:
                  MODREX_GA_MEASUREMENT_ID: ${{ secrets.MODREX_GA_MEASUREMENT_ID }}

            # linuxdeploy sweeps the build image's wayland libraries into the bundle as GTK
            # dependencies, but Mesa always comes from the user's own system and cannot pair
            # with a wayland client older than itself: against Arch's 1.26 the bundled 1.22
            # fails EGL display creation and the window renders black. Tauri exposes no
            # exclude list, so they come out afterwards.
            - name: Repack AppImage without bundled wayland libraries
              working-directory: apps/desktop/src-tauri/target/release/bundle/appimage
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  APPIMAGE_FILES=(*.AppImage)
                  if (( ${#APPIMAGE_FILES[@]} != 1 )); then
                    echo "Expected one AppImage, found ${#APPIMAGE_FILES[@]}" >&2
                    exit 1
                  fi
                  APPIMAGE=${APPIMAGE_FILES[0]}

                  # Keep the runtime the bundler shipped. Left to itself appimagetool
                  # downloads one from an unpinned continuous release, which would put a
                  # moving binary at the head of every signed AppImage we publish.
                  head -c "$(./"$APPIMAGE" --appimage-offset)" "$APPIMAGE" > runtime

                  ./"$APPIMAGE" --appimage-extract > /dev/null
                  rm -f squashfs-root/usr/lib/libwayland-*.so.*

                  curl -fsSL -o appimagetool \
                    https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
                  echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' | sha256sum -c -
                  chmod +x appimagetool
                  APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
                    ./appimagetool --runtime-file runtime squashfs-root "$APPIMAGE"
                  rm -rf squashfs-root appimagetool runtime

            # RPM forbids a dash in Version, so a nightly keeps the part after the dash in Release.
            - name: Bundle RPM
              working-directory: apps/desktop
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  RPM_VERSION=${VERSION%%-*}
                  RPM_RELEASE=1
                  if [ "$RPM_VERSION" != "$VERSION" ]; then
                    RPM_RELEASE=${VERSION#*-}
                  fi
                  OVERRIDE=$(jq -nc --arg version "$RPM_VERSION" --arg release "$RPM_RELEASE" \
                    '{version: $version, bundle: {linux: {rpm: {release: $release}}}}')
                  bun --bun run tauri bundle --bundles rpm \
                    --config src-tauri/tauri.release.conf.json --config "$OVERRIDE"

            - name: Sign updater artifacts
              working-directory: apps/desktop
              env:
                  VERSION: ${{ inputs.version }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  BUNDLES=$PWD/src-tauri/target/release/bundle
                  for ARTIFACT in "$BUNDLES"/deb/*.deb "$BUNDLES"/rpm/*.rpm "$BUNDLES"/appimage/*.AppImage; do
                    bun --bun run tauri signer sign --app-version "$VERSION" "$ARTIFACT"
                  done

            - name: Verify Linux artifacts
              working-directory: apps/desktop/src-tauri/target/release/bundle
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  APPIMAGE_FILES=(appimage/*.AppImage)
                  RPM_FILES=(rpm/*.rpm)
                  APPIMAGE=${APPIMAGE_FILES[0]}
                  RPM=${RPM_FILES[0]}

                  (cd appimage && ./"$(basename "$APPIMAGE")" --appimage-extract > /dev/null)
                  WAYLAND_LIBS=(appimage/squashfs-root/usr/lib/libwayland-*.so.*)
                  rm -rf appimage/squashfs-root
                  if (( ${#WAYLAND_LIBS[@]} != 0 )); then
                    echo "AppImage still bundles: ${WAYLAND_LIBS[*]}" >&2
                    exit 1
                  fi

                  # The updater rejects a release that fails these, so they stop the build here.
                  jq -r '.plugins.updater.pubkey' \
                    "$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.conf.json" | base64 -d > updater.pub
                  for ARTIFACT in deb/*.deb "$RPM" "$APPIMAGE"; do
                    base64 -d < "$ARTIFACT.sig" > artifact.minisig
                    minisign -V -m "$ARTIFACT" -p updater.pub -x artifact.minisig
                    if ! grep -aq "version:$VERSION\$" artifact.minisig; then
                      echo "$ARTIFACT is not signed for $VERSION" >&2
                      exit 1
                    fi
                  done
                  rm -f updater.pub artifact.minisig

                  EXPECTED_RPM=$VERSION
                  if [ "${VERSION%%-*}" = "$VERSION" ]; then
                    EXPECTED_RPM=$VERSION-1
                  fi
                  RPM_VERSION=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$RPM")
                  if [ "$RPM_VERSION" != "$EXPECTED_RPM" ]; then
                    echo "RPM version is $RPM_VERSION, expected $EXPECTED_RPM" >&2
                    exit 1
                  fi

                  # A patched binary holds its own marker twice and no placeholder. The rpm2cpio
                  # in rpm 4.18 exits 1 after writing the whole payload, so its status is not
                  # used. The signature check above covers the file, and cpio fails on a
                  # truncated payload. grep exits 1 when nothing matches, which pipefail would
                  # treat as a failure, so only a status above 1 fails a count.
                  rpm2cpio "$RPM" > payload.cpio || true
                  cpio -i --quiet --to-stdout ./usr/bin/modrex < payload.cpio > rpm-binary
                  rm -f payload.cpio
                  if [ ! -s rpm-binary ]; then
                    echo "No binary could be read from $RPM" >&2
                    exit 1
                  fi
                  count_marks() { { grep -a -o "$1" rpm-binary || [ $? -eq 1 ]; } | wc -l; }
                  RPM_MARKS=$(count_marks __TAURI_BUNDLE_TYPE_VAR_RPM)
                  UNSET_MARKS=$(count_marks __TAURI_BUNDLE_TYPE_VAR_UNK)
                  rm -f rpm-binary
                  if [ "$RPM_MARKS" != 2 ] || [ "$UNSET_MARKS" != 0 ]; then
                    echo "RPM binary is not marked as an RPM install" >&2
                    exit 1
                  fi

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-deb
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/deb/*.deb
                      apps/desktop/src-tauri/target/release/bundle/deb/*.sig

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-rpm
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
                      apps/desktop/src-tauri/target/release/bundle/rpm/*.sig

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-appimage
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
                      apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
