name: Discord Release Notification
on:
    workflow_call:
        inputs:
            tag_name:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Version tag to fetch and post'
                required: true

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Post to Discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ inputs.tag_name }}
              run: bash .github/scripts/post-discord-release.sh "$TAG"
