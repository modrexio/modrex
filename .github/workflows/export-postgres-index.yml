name: Export Postgres index

on:
    workflow_dispatch:
        inputs:
            game:
                description: 'Game to export'
                required: true
                type: choice
                options: [pd3, pd2, pdth, cb, raid]

permissions:
    contents: read

concurrency:
    group: postgres-index
    cancel-in-progress: false

jobs:
    export:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Apply Postgres schema migrations
              env:
                  INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
              run: bun run --cwd apps/index migrate:postgres

            - name: Export SQLite database
              env:
                  INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
              run: bun run --cwd apps/index export:postgres-sqlite --game=${{ inputs.game }} --output=artifacts/${{ inputs.game }}.db

            - name: Upload SQLite artifact
              uses: actions/upload-artifact@v7
              with:
                  name: postgres-index-${{ inputs.game }}
                  path: apps/index/artifacts/${{ inputs.game }}.db
                  if-no-files-found: error
