name: Migrate Postgres index

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: postgres-index
    cancel-in-progress: false

jobs:
    migrate:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Apply Postgres schema migrations
              env:
                  INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
              run: bun run --cwd apps/index migrate:postgres

            - name: Verify Postgres game catalog
              env:
                  INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
              run: bun run --cwd apps/index verify:postgres-catalog
