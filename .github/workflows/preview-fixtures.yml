name: Preview Fixtures

on:
    schedule:
        - cron: '41 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: preview-fixtures
    cancel-in-progress: true

jobs:
    refresh:
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: auto
            R2_BUCKET: ${{ secrets.R2_BUCKET }}
            R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        steps:
            - name: Check out main
              uses: actions/checkout@v7
              with:
                  ref: main

            - name: Install Rust
              run: rustup install --no-self-update

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install AWS CLI
              run: |
                  curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
                  unzip -q awscliv2.zip
                  sudo ./aws/install --update

            # The exporter keeps the previous news file when the news site blocks the runner.
            - name: Download current snapshot
              run: |
                  set -euo pipefail
                  aws s3 sync "s3://${R2_BUCKET}/preview/" apps/desktop/src/renderer/preview/fixtures/ \
                      --endpoint-url "${R2_ENDPOINT}" --exclude manifest.json

            - name: Export snapshot
              working-directory: apps/desktop/src-tauri
              env:
                  PREVIEW_FIXTURES_DIR: ${{ github.workspace }}/apps/desktop/src/renderer/preview/fixtures
              run: |
                  set -euo pipefail
                  # Live ModWorkshop data at the app's own rate limit: five games take a few minutes.
                  cargo test --test export_preview_fixtures -- --ignored --nocapture

            # Publish only a snapshot that the browser preview can render.
            - name: Verify snapshot
              working-directory: apps/desktop
              env:
                  PREVIEW_FIXTURES_READY: '1'
              run: |
                  set -euo pipefail
                  bun --bun run test:preview

            - name: Write manifest
              working-directory: apps/desktop/src/renderer/preview/fixtures
              run: |
                  set -euo pipefail
                  find . -type f -name '*.json' | sed 's|^\./||' | sort | jq -R . | jq -s . > "$RUNNER_TEMP/manifest.json"
                  [ "$(jq length "$RUNNER_TEMP/manifest.json")" -gt 0 ] || { echo "::error::snapshot is empty"; exit 1; }

            - name: Upload snapshot and manifest
              run: |
                  set -euo pipefail
                  aws s3 cp apps/desktop/src/renderer/preview/fixtures/ "s3://${R2_BUCKET}/preview/" \
                      --recursive --endpoint-url "${R2_ENDPOINT}" \
                      --content-type application/json --cache-control 'no-cache'
                  aws s3 cp "$RUNNER_TEMP/manifest.json" "s3://${R2_BUCKET}/preview/manifest.json" \
                      --endpoint-url "${R2_ENDPOINT}" \
                      --content-type application/json --cache-control 'no-cache'

            - name: Trigger preview rebuild
              env:
                  DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_APP_PREVIEW_DEPLOY_HOOK_URL }}
              run: |
                  set -euo pipefail
                  curl -fsS -X POST "${DEPLOY_HOOK_URL}"
