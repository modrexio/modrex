name: App Preview Link

on:
    pull_request_target:
        types: [opened, reopened, synchronize]

permissions:
    pull-requests: write

jobs:
    comment:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/github-script@v9
              with:
                  script: |
                      const marker = '<!-- modrex-app-preview -->'
                      const number = context.issue.number
                      const url = `https://app-preview.modrex.net/pr/${number}`
                      const body = [
                        marker,
                        '## Modrex app preview',
                        '',
                        url,
                        '',
                        'This link follows the pull request and updates after each successful preview deployment.',
                      ].join('\n')

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        ...context.repo,
                        issue_number: number,
                        per_page: 100,
                      })
                      const existing = comments.find(
                        (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
                      )

                      if (existing) {
                        await github.rest.issues.updateComment({
                          ...context.repo,
                          comment_id: existing.id,
                          body,
                        })
                      } else {
                        await github.rest.issues.createComment({
                          ...context.repo,
                          issue_number: number,
                          body,
                        })
                      }
