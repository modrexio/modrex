name: Refresh Postgres index

on:
    workflow_dispatch:
        inputs:
            game:
                description: 'Game to refresh, or all five games'
                required: true
                default: all
                type: choice
                options:
                    - all
                    - auto
                    - pd3
                    - pd2
                    - pdth
                    - cb
                    - raid
            limit:
                description: 'Unprocessed listings per selected game (1-1000)'
                required: true
                default: '10'
                type: string

permissions:
    contents: read

concurrency:
    group: postgres-index-r2
    cancel-in-progress: false

jobs:
    refresh:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: auto
            R2_BUCKET: ${{ secrets.R2_BUCKET }}
            R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
            INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
            GAME: ${{ inputs.game }}
            LIMIT: ${{ inputs.limit }}
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 10.32.1

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y p7zip-full
                  curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
                  unzip -q awscliv2.zip
                  sudo ./aws/install --update

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Refresh and publish game indexes
              run: |
                  set -euo pipefail
                  case "${LIMIT}" in
                      ''|*[!0-9]*) exit 1 ;;
                  esac
                  if [ "${LIMIT}" -lt 1 ] || [ "${LIMIT}" -gt 1000 ]; then
                      exit 1
                  fi
                  pnpm --dir apps/index migrate:postgres
                  pnpm --dir apps/index verify:postgres-catalog
                  pnpm --dir apps/index sync:postgres-listings
                  if [ "${GAME}" = auto ]; then
                      GAME="$(pnpm --dir apps/index exec tsx postgres/report-coverage.ts --next)"
                      if [ -z "${GAME}" ]; then
                          GAME=none
                      fi
                  fi
                  case "${GAME}" in
                      all) games='pd3 pd2 pdth cb raid' ;;
                      pd3|pd2|pdth|cb|raid) games="${GAME}" ;;
                      none) games='' ;;
                      *) exit 1 ;;
                  esac
                  mkdir -p apps/index/artifacts
                  for game in ${games}; do
                      pnpm --dir apps/index process:postgres-content -- --game="${game}" --limit="${LIMIT}"
                      database="apps/index/artifacts/${game}.db"
                      pnpm --dir apps/index export:postgres-sqlite -- --game="${game}" --output="artifacts/${game}.db" --require-files
                      sha256="$(sha256sum "${database}" | cut -d ' ' -f 1)"
                      if ! aws s3 cp "s3://${R2_BUCKET}/catalog/latest.json" latest.json --endpoint-url "${R2_ENDPOINT}"; then
                          printf '%s\n' '{"version":1,"games":{}}' > latest.json
                      fi
                      previous_sha256="$(jq -r --arg game "${game}" '.games[$game].sha256 // empty' latest.json)"
                      if [ "${sha256}" = "${previous_sha256}" ]; then
                          printf 'No content change for %s; keeping the current generation.\n' "${game}"
                          continue
                      fi
                      generation="$(date -u +%Y-%m-%dT%H%M%SZ)"
                      key="catalog/${generation}/${game}.db"
                      size="$(wc -c < "${database}")"
                      aws s3 cp "${database}" "s3://${R2_BUCKET}/${key}" --endpoint-url "${R2_ENDPOINT}" --content-type application/vnd.sqlite3 --cache-control 'public, max-age=31536000, immutable'
                      jq --arg game "${game}" --arg key "${key}" --arg sha256 "${sha256}" --arg generation "${generation}" --argjson size "${size}" \
                          '.version = 1 | .generated_at = $generation | .games = (.games // {}) | .games[$game] = {key: $key, sha256: $sha256, size: $size, generated_at: $generation}' \
                          latest.json > latest.next.json
                      aws s3 cp latest.next.json "s3://${R2_BUCKET}/catalog/latest.json" --endpoint-url "${R2_ENDPOINT}" --content-type application/json --cache-control 'no-cache'
                      printf 'Published %s with sha256 %s\n' "${key}" "${sha256}"
                  done
                  supported_mods="$(pnpm --dir apps/index exec tsx postgres/report-stats.ts)"
                  if ! aws s3 cp "s3://${R2_BUCKET}/catalog/latest.json" latest.json --endpoint-url "${R2_ENDPOINT}"; then
                      printf '%s\n' '{"version":1,"games":{}}' > latest.json
                  fi
                  previous_supported_mods="$(jq -r '.stats.supportedMods // empty' latest.json)"
                  if [ "${supported_mods}" != "${previous_supported_mods}" ]; then
                      generated_at="$(date -u +%Y-%m-%dT%H%M%SZ)"
                      jq --argjson supported_mods "${supported_mods}" --arg generated_at "${generated_at}" \
                          '.version = 1 | .stats = {supportedMods: $supported_mods, generatedAt: $generated_at}' \
                          latest.json > latest.next.json
                      aws s3 cp latest.next.json "s3://${R2_BUCKET}/catalog/latest.json" --endpoint-url "${R2_ENDPOINT}" --content-type application/json --cache-control 'no-cache'
                  fi

            - name: Report remaining archive work
              run: pnpm --dir apps/index report:postgres-coverage
