name: Patch release notes into latest.json

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    patch-notes:
        if: ${{ !github.event.release.prerelease }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: refs/tags/${{ github.event.release.tag_name }}
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - name: Download latest.json from release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release download "${{ github.event.release.tag_name }}" \
                    --repo "${{ github.repository }}" \
                    --pattern "latest.json"

            - name: Inject changelog section into notes field
              working-directory: apps/desktop
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  NOTES="$RUNNER_TEMP/release-notes.md"
                  bun scripts/changelog-section.mts "${TAG#v}" > "$NOTES"
                  if ! grep -q '[^[:space:]]' "$NOTES"; then
                    echo "::error::CHANGELOG.md has no release notes for $TAG"
                    exit 1
                  fi
                  jq --rawfile notes "$NOTES" '.notes = $notes' ../../latest.json > ../../latest.patched.json
                  mv ../../latest.patched.json ../../latest.json

            - name: Re-upload latest.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    --repo "${{ github.repository }}" \
                    --clobber \
                    latest.json
