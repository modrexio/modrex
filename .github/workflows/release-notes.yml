name: Patch release notes into latest.json

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    patch-notes:
        if: ${{ !github.event.release.prerelease }}
        runs-on: ubuntu-latest
        steps:
            - name: Download latest.json from release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release download "${{ github.event.release.tag_name }}" \
                    --repo "${{ github.repository }}" \
                    --pattern "latest.json"

            # The body reaches the script as an environment variable, never as inline
            # ${{ }} text: the runner substitutes expressions before bash parses the
            # script, so a body line reading exactly BODY would close the heredoc early
            # and run everything after it as shell.
            - name: Inject release body into notes field
              env:
                  NOTES: ${{ github.event.release.body }}
              run: |
                  jq --arg notes "$NOTES" '.notes = $notes' latest.json > latest.patched.json
                  mv latest.patched.json latest.json

            - name: Re-upload latest.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    --repo "${{ github.repository }}" \
                    --clobber \
                    latest.json
