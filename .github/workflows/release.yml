name: Release

on:
    push:
        tags:
            - 'v*'

cache-mode: none

permissions:
    actions: read
    contents: write

jobs:
    validate-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.ver.outputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate release provenance
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  TAG_TYPE=$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")
                  if [ "$TAG_TYPE" != 'tag' ]; then
                    echo "::error::$GITHUB_REF_NAME must be an annotated tag"
                    exit 1
                  fi

                  TAG_COMMIT=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")
                  CHECKOUT_COMMIT=$(git rev-parse HEAD)
                  if [ "$TAG_COMMIT" != "$CHECKOUT_COMMIT" ]; then
                    echo "::error::$GITHUB_REF_NAME does not point at the checked-out commit"
                    exit 1
                  fi

                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "$TAG_COMMIT" FETCH_HEAD; then
                    echo "::error::$GITHUB_REF_NAME is not reachable from main"
                    exit 1
                  fi

                  RUNS_URL="/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TAG_COMMIT&event=push&per_page=1"
                  for ATTEMPT in {1..120}; do
                    CI_STATE=$(gh api "$RUNS_URL" --jq 'if .total_count == 0 then ["missing", "pending"] else [.workflow_runs[0].status, (.workflow_runs[0].conclusion // "pending")] end | @tsv')
                    read -r CI_STATUS CI_CONCLUSION <<< "$CI_STATE"

                    if [ "$CI_STATUS" = 'completed' ] && [ "$CI_CONCLUSION" = 'success' ]; then
                      echo "CI passed for $TAG_COMMIT"
                      break
                    fi
                    if [ "$CI_STATUS" = 'completed' ]; then
                      echo "::error::CI finished with conclusion: $CI_CONCLUSION"
                      exit 1
                    fi

                    if [ "$ATTEMPT" -eq 120 ]; then
                      echo "::error::Timed out waiting for CI on $TAG_COMMIT"
                      exit 1
                    fi

                    echo "Waiting for CI on $TAG_COMMIT ($CI_STATUS)"
                    sleep 10
                  done

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - run: bun scripts/check-version.mts "$GITHUB_REF_NAME"
              working-directory: apps/desktop

            - name: Extract version
              id: ver
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    build:
        needs: validate-version
        uses: ./.github/workflows/desktop-build.yml
        with:
            ref: ${{ github.sha }}
            version: ${{ needs.validate-version.outputs.version }}
        secrets: inherit

    publish:
        needs: [validate-version, build]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - uses: actions/download-artifact@v8

            - name: Extract changelog section
              working-directory: apps/desktop
              run: bun scripts/changelog-section.mts "${{ needs.validate-version.outputs.version }}" > ../../RELEASE_BODY.md

            - name: Rename updater artifacts to stable arch-suffixed names
              run: |
                  shopt -s nullglob
                  WIN_FILES=(windows-nsis/*.exe)
                  DEB_FILES=(linux-deb/*.deb)
                  RPM_FILES=(linux-rpm/*.rpm)
                  APPIMAGE_FILES=(linux-appimage/*.AppImage)

                  if (( ${#WIN_FILES[@]} != 1 )); then
                    echo "Expected one NSIS installer, found ${#WIN_FILES[@]}" >&2
                    exit 1
                  fi
                  if (( ${#DEB_FILES[@]} != 1 )); then
                    echo "Expected one DEB package, found ${#DEB_FILES[@]}" >&2
                    exit 1
                  fi
                  if (( ${#RPM_FILES[@]} != 1 )); then
                    echo "Expected one RPM package, found ${#RPM_FILES[@]}" >&2
                    exit 1
                  fi
                  if (( ${#APPIMAGE_FILES[@]} != 1 )); then
                    echo "Expected one AppImage, found ${#APPIMAGE_FILES[@]}" >&2
                    exit 1
                  fi

                  WIN_EXE=${WIN_FILES[0]}
                  DEB=${DEB_FILES[0]}
                  RPM=${RPM_FILES[0]}
                  APPIMAGE=${APPIMAGE_FILES[0]}

                  for ARTIFACT in "$WIN_EXE" "$DEB" "$RPM" "$APPIMAGE"; do
                    if [ ! -s "${ARTIFACT}.sig" ]; then
                      echo "Missing updater signature: ${ARTIFACT}.sig" >&2
                      exit 1
                    fi
                  done

                  mv "$WIN_EXE" windows-nsis/modrex_x86_64.exe
                  mv "${WIN_EXE}.sig" windows-nsis/modrex_x86_64.exe.sig
                  mv "$DEB" linux-deb/modrex_x86_64.deb
                  mv "${DEB}.sig" linux-deb/modrex_x86_64.deb.sig
                  mv "$RPM" linux-rpm/modrex_x86_64.rpm
                  mv "${RPM}.sig" linux-rpm/modrex_x86_64.rpm.sig
                  mv "$APPIMAGE" linux-appimage/modrex_x86_64.AppImage
                  mv "${APPIMAGE}.sig" linux-appimage/modrex_x86_64.AppImage.sig

            - name: Generate latest.json (tauri-plugin-updater)
              run: |
                  TAG=$GITHUB_REF_NAME
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  WIN_SIG=$(<windows-nsis/modrex_x86_64.exe.sig)
                  DEB_SIG=$(<linux-deb/modrex_x86_64.deb.sig)
                  RPM_SIG=$(<linux-rpm/modrex_x86_64.rpm.sig)
                  APPIMAGE_SIG=$(<linux-appimage/modrex_x86_64.AppImage.sig)
                  jq -n \
                    --arg version "${{ needs.validate-version.outputs.version }}" \
                    --arg notes "" \
                    --arg pub_date "$DATE" \
                    --arg win_sig "$WIN_SIG" \
                    --arg win_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.exe" \
                    --arg deb_sig "$DEB_SIG" \
                    --arg deb_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.deb" \
                    --arg rpm_sig "$RPM_SIG" \
                    --arg rpm_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.rpm" \
                    --arg appimage_sig "$APPIMAGE_SIG" \
                    --arg appimage_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.AppImage" \
                    '{
                      version: $version,
                      notes: $notes,
                      pub_date: $pub_date,
                      platforms: {
                        "windows-x86_64": {signature: $win_sig, url: $win_url},
                        "linux-x86_64-deb": {signature: $deb_sig, url: $deb_url},
                        "linux-x86_64-rpm": {signature: $rpm_sig, url: $rpm_url},
                        "linux-x86_64-appimage": {signature: $appimage_sig, url: $appimage_url}
                      }
                    }' \
                    > latest.json

            - name: Validate updater artifacts and package migration
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y minisign rpm

                  jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json |
                    base64 --decode > "$RUNNER_TEMP/updater.pub"

                  TARGETS=(
                    windows-x86_64
                    linux-x86_64-deb
                    linux-x86_64-rpm
                    linux-x86_64-appimage
                  )
                  ARTIFACTS=(
                    windows-nsis/modrex_x86_64.exe
                    linux-deb/modrex_x86_64.deb
                    linux-rpm/modrex_x86_64.rpm
                    linux-appimage/modrex_x86_64.AppImage
                  )

                  for INDEX in "${!TARGETS[@]}"; do
                    TARGET=${TARGETS[$INDEX]}
                    ARTIFACT=${ARTIFACTS[$INDEX]}
                    SIGNATURE=$(<"${ARTIFACT}.sig")
                    DECODED_SIGNATURE="$RUNNER_TEMP/updater-$INDEX.minisig"
                    printf '%s' "$SIGNATURE" | base64 --decode > "$DECODED_SIGNATURE"
                    minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$ARTIFACT" -x "$DECODED_SIGNATURE"

                    MANIFEST_SIGNATURE=$(jq -r --arg target "$TARGET" '.platforms[$target].signature // empty' latest.json)
                    if [ "$MANIFEST_SIGNATURE" != "$SIGNATURE" ]; then
                      echo "::error::latest.json has the wrong signature for $TARGET"
                      exit 1
                    fi

                    EXPECTED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$ARTIFACT")"
                    MANIFEST_URL=$(jq -r --arg target "$TARGET" '.platforms[$target].url // empty' latest.json)
                    if [ "$MANIFEST_URL" != "$EXPECTED_URL" ]; then
                      echo "::error::latest.json has the wrong URL for $TARGET"
                      exit 1
                    fi
                  done

                  if [ "$(dpkg-deb -f linux-deb/modrex_x86_64.deb Conflicts)" != 'pd3-mod-manager' ]; then
                    echo '::error::DEB is missing the pd3-mod-manager conflict'
                    exit 1
                  fi
                  if [ "$(dpkg-deb -f linux-deb/modrex_x86_64.deb Replaces)" != 'pd3-mod-manager' ]; then
                    echo '::error::DEB is missing the pd3-mod-manager replacement'
                    exit 1
                  fi
                  if ! rpm -qp --obsoletes linux-rpm/modrex_x86_64.rpm | grep -Fxq pd3-mod-manager; then
                    echo '::error::RPM is missing the pd3-mod-manager obsoletion'
                    exit 1
                  fi

            - name: Publish release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
              with:
                  name: ${{ github.ref_name }}
                  draft: true
                  body_path: RELEASE_BODY.md
                  files: |
                      windows-nsis/modrex_x86_64.exe
                      linux-deb/modrex_x86_64.deb
                      linux-rpm/modrex_x86_64.rpm
                      linux-appimage/modrex_x86_64.AppImage
                      latest.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
