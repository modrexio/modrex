name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    actions: read
    contents: write

jobs:
    validate-version:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate release provenance
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  TAG_TYPE=$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")
                  if [ "$TAG_TYPE" != 'tag' ]; then
                    echo "::error::$GITHUB_REF_NAME must be an annotated tag"
                    exit 1
                  fi

                  TAG_COMMIT=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")
                  CHECKOUT_COMMIT=$(git rev-parse HEAD)
                  if [ "$TAG_COMMIT" != "$CHECKOUT_COMMIT" ]; then
                    echo "::error::$GITHUB_REF_NAME does not point at the checked-out commit"
                    exit 1
                  fi

                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "$TAG_COMMIT" FETCH_HEAD; then
                    echo "::error::$GITHUB_REF_NAME is not reachable from main"
                    exit 1
                  fi

                  RUNS_URL="/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TAG_COMMIT&event=push&per_page=1"
                  for ATTEMPT in {1..120}; do
                    CI_STATE=$(gh api "$RUNS_URL" --jq 'if .total_count == 0 then ["missing", "pending"] else [.workflow_runs[0].status, (.workflow_runs[0].conclusion // "pending")] end | @tsv')
                    read -r CI_STATUS CI_CONCLUSION <<< "$CI_STATE"

                    if [ "$CI_STATUS" = 'completed' ] && [ "$CI_CONCLUSION" = 'success' ]; then
                      echo "CI passed for $TAG_COMMIT"
                      break
                    fi
                    if [ "$CI_STATUS" = 'completed' ]; then
                      echo "::error::CI finished with conclusion: $CI_CONCLUSION"
                      exit 1
                    fi

                    if [ "$ATTEMPT" -eq 120 ]; then
                      echo "::error::Timed out waiting for CI on $TAG_COMMIT"
                      exit 1
                    fi

                    echo "Waiting for CI on $TAG_COMMIT ($CI_STATUS)"
                    sleep 10
                  done

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
              working-directory: apps/desktop

    build-windows:
        needs: validate-version
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              continue-on-error: true
              with:
                  workspaces: apps/desktop/src-tauri

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm build:signed
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  MODREX_GA_MEASUREMENT_ID: ${{ secrets.MODREX_GA_MEASUREMENT_ID }}
                  MODREX_GA_API_SECRET: ${{ secrets.MODREX_GA_API_SECRET }}

            - name: Smoke-test NSIS installer
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $expectedVersion = '${{ github.ref_name }}' -replace '^v', ''
                  $installDir = Join-Path $env:RUNNER_TEMP 'modrex-nsis-smoke'
                  $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Modrex'
                  $installers = @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe')

                  if ($installers.Count -ne 1) {
                      throw "Expected one NSIS installer, found $($installers.Count)"
                  }

                  $installer = $installers[0]
                  if ($installer.VersionInfo.ProductVersion -ne $expectedVersion) {
                      throw "Installer version is $($installer.VersionInfo.ProductVersion), expected $expectedVersion"
                  }

                  try {
                      foreach ($attempt in 'fresh install', 'reinstall') {
                          $process = Start-Process $installer.FullName `
                            -ArgumentList '/S', "/D=$installDir" `
                            -Wait -PassThru
                          if ($process.ExitCode -ne 0) {
                              throw "NSIS $attempt failed with exit code $($process.ExitCode)"
                          }
                      }

                      $executable = Join-Path $installDir 'modrex.exe'
                      $uninstaller = Join-Path $installDir 'uninstall.exe'
                      if (!(Test-Path -LiteralPath $executable)) {
                          throw 'Installed executable was not created'
                      }
                      if (!(Test-Path -LiteralPath $uninstaller)) {
                          throw 'NSIS uninstaller was not created'
                      }

                      $installedVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
                      if ($installedVersion -ne $expectedVersion) {
                          throw "Installed version is $installedVersion, expected $expectedVersion"
                      }

                      $registration = Get-ItemProperty $uninstallKey
                      if ($registration.DisplayName -ne 'Modrex') {
                          throw "Registered display name is $($registration.DisplayName), expected Modrex"
                      }
                      if ($registration.DisplayVersion -ne $expectedVersion) {
                          throw "Registered version is $($registration.DisplayVersion), expected $expectedVersion"
                      }
                      if ($registration.Publisher -ne 'modrex') {
                          throw "Registered publisher is $($registration.Publisher), expected modrex"
                      }
                      if ($registration.InstallLocation.Trim('"') -ne $installDir) {
                          throw "Registered install location is $($registration.InstallLocation), expected $installDir"
                      }

                      $process = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
                      if ($process.ExitCode -ne 0) {
                          throw "NSIS uninstall failed with exit code $($process.ExitCode)"
                      }

                      for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $installDir); $i++) {
                          Start-Sleep -Milliseconds 250
                      }
                      if (Test-Path -LiteralPath $installDir) {
                          throw 'Silent uninstall left the installation directory behind'
                      }
                      if (Test-Path $uninstallKey) {
                          throw 'Silent uninstall left the uninstall registration behind'
                      }
                  } finally {
                      $uninstaller = Join-Path $installDir 'uninstall.exe'
                      if (Test-Path -LiteralPath $uninstaller) {
                          Start-Process $uninstaller -ArgumentList '/S' -Wait
                      }
                      if (Test-Path -LiteralPath $installDir) {
                          Remove-Item -LiteralPath $installDir -Recurse -Force
                      }
                      if (Test-Path $uninstallKey) {
                          Remove-Item $uninstallKey -Recurse -Force
                      }
                  }

            - uses: actions/upload-artifact@v7
              with:
                  name: windows-nsis
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
                      apps/desktop/src-tauri/target/release/bundle/nsis/*.sig

    build-linux:
        needs: validate-version
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    rpm \
                    minisign

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build:signed
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  MODREX_GA_MEASUREMENT_ID: ${{ secrets.MODREX_GA_MEASUREMENT_ID }}
                  MODREX_GA_API_SECRET: ${{ secrets.MODREX_GA_API_SECRET }}

            # linuxdeploy sweeps the build image's wayland libraries into the bundle as GTK
            # dependencies, but Mesa always comes from the user's own system and cannot pair
            # with a wayland client older than itself: against Arch's 1.26 the bundled 1.22
            # fails EGL display creation and the window renders black. Tauri exposes no
            # exclude list, so they come out afterwards.
            - name: Repack AppImage without bundled wayland libraries
              working-directory: apps/desktop/src-tauri/target/release/bundle/appimage
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  APPIMAGE_FILES=(*.AppImage)
                  if (( ${#APPIMAGE_FILES[@]} != 1 )); then
                    echo "Expected one AppImage, found ${#APPIMAGE_FILES[@]}" >&2
                    exit 1
                  fi
                  APPIMAGE=${APPIMAGE_FILES[0]}

                  # Keep the runtime the bundler shipped. Left to itself appimagetool
                  # downloads one from an unpinned continuous release, which would put a
                  # moving binary at the head of every signed AppImage we publish.
                  head -c "$(./"$APPIMAGE" --appimage-offset)" "$APPIMAGE" > runtime

                  ./"$APPIMAGE" --appimage-extract > /dev/null
                  rm -f squashfs-root/usr/lib/libwayland-*.so.*

                  curl -fsSL -o appimagetool \
                    https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
                  chmod +x appimagetool
                  APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
                    ./appimagetool --runtime-file runtime squashfs-root "$APPIMAGE"
                  rm -rf squashfs-root appimagetool runtime

                  # The bundler signed the bytes this step just replaced, so without a fresh
                  # signature every installed Linux client rejects the update.
                  pnpm --dir "$GITHUB_WORKSPACE/apps/desktop" exec tauri signer sign "$PWD/$APPIMAGE"

            - name: Verify repacked AppImage
              working-directory: apps/desktop/src-tauri/target/release/bundle/appimage
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  APPIMAGE_FILES=(*.AppImage)
                  APPIMAGE=${APPIMAGE_FILES[0]}

                  ./"$APPIMAGE" --appimage-extract > /dev/null
                  WAYLAND_LIBS=(squashfs-root/usr/lib/libwayland-*.so.*)
                  rm -rf squashfs-root
                  if (( ${#WAYLAND_LIBS[@]} != 0 )); then
                    echo "AppImage still bundles: ${WAYLAND_LIBS[*]}" >&2
                    exit 1
                  fi

                  # The updater accepts the release only if this passes, so it is checked
                  # here rather than discovered by clients that can no longer update.
                  jq -r '.plugins.updater.pubkey' \
                    "$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.conf.json" | base64 -d > updater.pub
                  base64 -d < "$APPIMAGE.sig" > repacked.minisig
                  minisign -V -m "$APPIMAGE" -p updater.pub -x repacked.minisig
                  rm -f updater.pub repacked.minisig

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-deb
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/deb/*.deb
                      apps/desktop/src-tauri/target/release/bundle/deb/*.sig

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-rpm
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
                      apps/desktop/src-tauri/target/release/bundle/rpm/*.sig

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-appimage
                  path: |
                      apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
                      apps/desktop/src-tauri/target/release/bundle/appimage/*.sig

    publish:
        needs: [build-windows, build-linux]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8

            - name: Extract version
              id: ver
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Extract changelog section
              working-directory: apps/desktop
              run: node scripts/changelog-section.mjs "${{ steps.ver.outputs.version }}" > ../../RELEASE_BODY.md

            - name: Rename updater artifacts to stable arch-suffixed names
              run: |
                  shopt -s nullglob
                  WIN_FILES=(windows-nsis/*.exe)
                  DEB_FILES=(linux-deb/*.deb)
                  RPM_FILES=(linux-rpm/*.rpm)
                  APPIMAGE_FILES=(linux-appimage/*.AppImage)

                  if (( ${#WIN_FILES[@]} != 1 )); then
                    echo "Expected one NSIS installer, found ${#WIN_FILES[@]}" >&2
                    exit 1
                  fi
                  if (( ${#DEB_FILES[@]} != 1 )); then
                    echo "Expected one DEB package, found ${#DEB_FILES[@]}" >&2
                    exit 1
                  fi
                  if (( ${#RPM_FILES[@]} != 1 )); then
                    echo "Expected one RPM package, found ${#RPM_FILES[@]}" >&2
                    exit 1
                  fi
                  if (( ${#APPIMAGE_FILES[@]} != 1 )); then
                    echo "Expected one AppImage, found ${#APPIMAGE_FILES[@]}" >&2
                    exit 1
                  fi

                  WIN_EXE=${WIN_FILES[0]}
                  DEB=${DEB_FILES[0]}
                  RPM=${RPM_FILES[0]}
                  APPIMAGE=${APPIMAGE_FILES[0]}

                  for ARTIFACT in "$WIN_EXE" "$DEB" "$RPM" "$APPIMAGE"; do
                    if [ ! -s "${ARTIFACT}.sig" ]; then
                      echo "Missing updater signature: ${ARTIFACT}.sig" >&2
                      exit 1
                    fi
                  done

                  mv "$WIN_EXE" windows-nsis/modrex_x86_64.exe
                  mv "${WIN_EXE}.sig" windows-nsis/modrex_x86_64.exe.sig
                  mv "$DEB" linux-deb/modrex_x86_64.deb
                  mv "${DEB}.sig" linux-deb/modrex_x86_64.deb.sig
                  mv "$RPM" linux-rpm/modrex_x86_64.rpm
                  mv "${RPM}.sig" linux-rpm/modrex_x86_64.rpm.sig
                  mv "$APPIMAGE" linux-appimage/modrex_x86_64.AppImage
                  mv "${APPIMAGE}.sig" linux-appimage/modrex_x86_64.AppImage.sig

                  # Legacy Electron clients request these package names.
                  cp linux-deb/modrex_x86_64.deb linux-deb/pd3-mod-manager.deb
                  cp linux-rpm/modrex_x86_64.rpm linux-rpm/pd3-mod-manager.rpm

            - name: Generate latest.json (tauri-plugin-updater)
              run: |
                  TAG=$GITHUB_REF_NAME
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  WIN_SIG=$(<windows-nsis/modrex_x86_64.exe.sig)
                  DEB_SIG=$(<linux-deb/modrex_x86_64.deb.sig)
                  RPM_SIG=$(<linux-rpm/modrex_x86_64.rpm.sig)
                  APPIMAGE_SIG=$(<linux-appimage/modrex_x86_64.AppImage.sig)
                  jq -n \
                    --arg version "${{ steps.ver.outputs.version }}" \
                    --arg notes "" \
                    --arg pub_date "$DATE" \
                    --arg win_sig "$WIN_SIG" \
                    --arg win_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.exe" \
                    --arg deb_sig "$DEB_SIG" \
                    --arg deb_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.deb" \
                    --arg rpm_sig "$RPM_SIG" \
                    --arg rpm_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.rpm" \
                    --arg appimage_sig "$APPIMAGE_SIG" \
                    --arg appimage_url "https://github.com/modrexio/modrex/releases/download/$TAG/modrex_x86_64.AppImage" \
                    '{
                      version: $version,
                      notes: $notes,
                      pub_date: $pub_date,
                      platforms: {
                        "windows-x86_64": {signature: $win_sig, url: $win_url},
                        "linux-x86_64-deb": {signature: $deb_sig, url: $deb_url},
                        "linux-x86_64-rpm": {signature: $rpm_sig, url: $rpm_url},
                        "linux-x86_64-appimage": {signature: $appimage_sig, url: $appimage_url}
                      }
                    }' \
                    > latest.json

            - name: Validate updater artifacts and package migration
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y minisign rpm

                  jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json |
                    base64 --decode > "$RUNNER_TEMP/updater.pub"

                  TARGETS=(
                    windows-x86_64
                    linux-x86_64-deb
                    linux-x86_64-rpm
                    linux-x86_64-appimage
                  )
                  ARTIFACTS=(
                    windows-nsis/modrex_x86_64.exe
                    linux-deb/modrex_x86_64.deb
                    linux-rpm/modrex_x86_64.rpm
                    linux-appimage/modrex_x86_64.AppImage
                  )

                  for INDEX in "${!TARGETS[@]}"; do
                    TARGET=${TARGETS[$INDEX]}
                    ARTIFACT=${ARTIFACTS[$INDEX]}
                    SIGNATURE=$(<"${ARTIFACT}.sig")
                    DECODED_SIGNATURE="$RUNNER_TEMP/updater-$INDEX.minisig"
                    printf '%s' "$SIGNATURE" | base64 --decode > "$DECODED_SIGNATURE"
                    minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$ARTIFACT" -x "$DECODED_SIGNATURE"

                    MANIFEST_SIGNATURE=$(jq -r --arg target "$TARGET" '.platforms[$target].signature // empty' latest.json)
                    if [ "$MANIFEST_SIGNATURE" != "$SIGNATURE" ]; then
                      echo "::error::latest.json has the wrong signature for $TARGET"
                      exit 1
                    fi

                    EXPECTED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$ARTIFACT")"
                    MANIFEST_URL=$(jq -r --arg target "$TARGET" '.platforms[$target].url // empty' latest.json)
                    if [ "$MANIFEST_URL" != "$EXPECTED_URL" ]; then
                      echo "::error::latest.json has the wrong URL for $TARGET"
                      exit 1
                    fi
                  done

                  if [ "$(dpkg-deb -f linux-deb/modrex_x86_64.deb Conflicts)" != 'pd3-mod-manager' ]; then
                    echo '::error::DEB is missing the pd3-mod-manager conflict'
                    exit 1
                  fi
                  if [ "$(dpkg-deb -f linux-deb/modrex_x86_64.deb Replaces)" != 'pd3-mod-manager' ]; then
                    echo '::error::DEB is missing the pd3-mod-manager replacement'
                    exit 1
                  fi
                  if ! rpm -qp --obsoletes linux-rpm/modrex_x86_64.rpm | grep -Fxq pd3-mod-manager; then
                    echo '::error::RPM is missing the pd3-mod-manager obsoletion'
                    exit 1
                  fi
                  if ! cmp -s linux-deb/modrex_x86_64.deb linux-deb/pd3-mod-manager.deb; then
                    echo '::error::Legacy DEB is not identical to the signed updater package'
                    exit 1
                  fi
                  if ! cmp -s linux-rpm/modrex_x86_64.rpm linux-rpm/pd3-mod-manager.rpm; then
                    echo '::error::Legacy RPM is not identical to the signed updater package'
                    exit 1
                  fi

            # Legacy Electron clients consume these manifests.
            - name: Generate latest.yml and latest-linux.yml (electron-updater compat)
              run: |
                  VERSION=${{ steps.ver.outputs.version }}
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  WIN_EXE=windows-nsis/modrex_x86_64.exe
                  WIN_FILENAME=$(basename "$WIN_EXE")
                  WIN_SIZE=$(stat -c %s "$WIN_EXE")
                  WIN_SHA512=$(openssl dgst -sha512 -binary "$WIN_EXE" | base64 -w 0)
                  {
                    echo "version: $VERSION"
                    echo "files:"
                    echo "  - url: $WIN_FILENAME"
                    echo "    sha512: $WIN_SHA512"
                    echo "    size: $WIN_SIZE"
                    echo "path: $WIN_FILENAME"
                    echo "sha512: $WIN_SHA512"
                    echo "releaseDate: '$DATE'"
                  } > latest.yml
                  LINUX_APPIMAGE=linux-appimage/modrex_x86_64.AppImage
                  LINUX_FILENAME=$(basename "$LINUX_APPIMAGE")
                  LINUX_SIZE=$(stat -c %s "$LINUX_APPIMAGE")
                  LINUX_SHA512=$(openssl dgst -sha512 -binary "$LINUX_APPIMAGE" | base64 -w 0)
                  {
                    echo "version: $VERSION"
                    echo "files:"
                    echo "  - url: $LINUX_FILENAME"
                    echo "    sha512: $LINUX_SHA512"
                    echo "    size: $LINUX_SIZE"
                    echo "path: $LINUX_FILENAME"
                    echo "sha512: $LINUX_SHA512"
                    echo "releaseDate: '$DATE'"
                  } > latest-linux.yml

            - name: Publish release
              uses: softprops/action-gh-release@v3
              with:
                  name: ${{ github.ref_name }}
                  draft: true
                  body_path: RELEASE_BODY.md
                  files: |
                      windows-nsis/modrex_x86_64.exe
                      linux-deb/modrex_x86_64.deb
                      linux-deb/pd3-mod-manager.deb
                      linux-rpm/modrex_x86_64.rpm
                      linux-rpm/pd3-mod-manager.rpm
                      linux-appimage/modrex_x86_64.AppImage
                      latest.json
                      latest.yml
                      latest-linux.yml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
