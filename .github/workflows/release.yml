name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              continue-on-error: true
              with:
                  workspaces: src-tauri

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm build
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  MODREX_GA_MEASUREMENT_ID: ${{ secrets.MODREX_GA_MEASUREMENT_ID }}
                  MODREX_GA_API_SECRET: ${{ secrets.MODREX_GA_API_SECRET }}

            - uses: actions/upload-artifact@v7
              with:
                  name: windows-nsis
                  path: |
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/nsis/*.sig

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    rpm

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  MODREX_GA_MEASUREMENT_ID: ${{ secrets.MODREX_GA_MEASUREMENT_ID }}
                  MODREX_GA_API_SECRET: ${{ secrets.MODREX_GA_API_SECRET }}

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-deb
                  path: src-tauri/target/release/bundle/deb/*.deb

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-rpm
                  path: src-tauri/target/release/bundle/rpm/*.rpm

            - uses: actions/upload-artifact@v7
              with:
                  name: linux-appimage
                  path: |
                      src-tauri/target/release/bundle/appimage/*.AppImage
                      src-tauri/target/release/bundle/appimage/*.sig

    publish:
        needs: [build-windows, build-linux]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8

            - name: Extract version
              id: ver
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Extract changelog section
              run: node scripts/changelog-section.mjs "${{ steps.ver.outputs.version }}" > RELEASE_BODY.md

            - name: Rename artifacts to stable arch-suffixed names
              run: |
                  WIN_EXE=$(ls windows-nsis/*.exe | head -1)
                  mv "$WIN_EXE" windows-nsis/modrex_x86_64.exe
                  mv "${WIN_EXE}.sig" windows-nsis/modrex_x86_64.exe.sig
                  APPIMAGE=$(ls linux-appimage/*.AppImage | head -1)
                  mv "$APPIMAGE" linux-appimage/modrex_x86_64.AppImage
                  mv "${APPIMAGE}.sig" linux-appimage/modrex_x86_64.AppImage.sig

            # compat: Electron app hardcodes LINUX_ARTIFACT='pd3-mod-manager' for deb/rpm downloads
            # deb is repacked to add Conflicts/Replaces so apt removes the old pd3-mod-manager package
            # rpm is rebuilt to add Obsoletes so dnf/rpm removes the old pd3-mod-manager package
            - name: Patch Linux artifacts and produce arch-suffixed + compat filenames
              run: |
                  DEB_SRC=$(ls linux-deb/*.deb | head -1)
                  dpkg-deb -R "$DEB_SRC" deb-tmp
                  printf "Conflicts: pd3-mod-manager\nReplaces: pd3-mod-manager\n" >> deb-tmp/DEBIAN/control
                  dpkg-deb -b deb-tmp linux-deb/modrex_x86_64.deb
                  cp linux-deb/modrex_x86_64.deb linux-deb/pd3-mod-manager.deb
                  rm -rf deb-tmp "$DEB_SRC"
                  sudo apt-get install -y rpm
                  RPM_SRC=$(ls linux-rpm/*.rpm | head -1)
                  NAME=$(rpm -qp --queryformat '%{NAME}' "$RPM_SRC")
                  VERSION=$(rpm -qp --queryformat '%{VERSION}' "$RPM_SRC")
                  RELEASE=$(rpm -qp --queryformat '%{RELEASE}' "$RPM_SRC")
                  SUMMARY=$(rpm -qp --queryformat '%{SUMMARY}' "$RPM_SRC"); SUMMARY=${SUMMARY:-$NAME}
                  LICENSE=$(rpm -qp --queryformat '%{LICENSE}' "$RPM_SRC"); LICENSE=${LICENSE:-MIT}
                  ARCH=$(rpm -qp --queryformat '%{ARCH}' "$RPM_SRC")
                  mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
                  STAGING="$HOME/rpmbuild/BUILD/stage"
                  mkdir -p "$STAGING"
                  rpm2cpio "$RPM_SRC" | (cd "$STAGING" && cpio -idmv 2>/dev/null)
                  SPEC="$HOME/rpmbuild/SPECS/${NAME}.spec"
                  {
                    printf "Name:      %s\n" "$NAME"
                    printf "Version:   %s\n" "$VERSION"
                    printf "Release:   %s\n" "$RELEASE"
                    printf "Summary:   %s\n" "$SUMMARY"
                    printf "License:   %s\n" "$LICENSE"
                    printf "BuildArch: %s\n" "$ARCH"
                    printf "Obsoletes: pd3-mod-manager\n"
                    printf "\n%%description\n%s\n" "$SUMMARY"
                    printf "\n%%install\ncp -a %s/. %%{buildroot}/\n" "$STAGING"
                    printf "\n%%files\n"
                    find "$STAGING" ! -type d | sed "s|$STAGING||" | sort
                  } > "$SPEC"
                  rpmbuild -bb \
                    --define "_topdir $HOME/rpmbuild" \
                    --define "__os_install_post %{nil}" \
                    --define "_build_id_links none" \
                    "$SPEC"
                  mv "$(find ~/rpmbuild/RPMS -name '*.rpm' | head -1)" linux-rpm/modrex_x86_64.rpm
                  cp linux-rpm/modrex_x86_64.rpm linux-rpm/pd3-mod-manager.rpm
                  rm -f "$RPM_SRC"

            - name: Generate latest.json (tauri-plugin-updater)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG=$GITHUB_REF_NAME
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  WIN_EXE=$(ls windows-nsis/*.exe | head -1)
                  WIN_FILENAME=$(basename "$WIN_EXE")
                  WIN_SIG=$(cat "windows-nsis/${WIN_FILENAME}.sig")
                  LINUX_APPIMAGE=$(ls linux-appimage/*.AppImage | head -1)
                  LINUX_FILENAME=$(basename "$LINUX_APPIMAGE")
                  LINUX_SIG=$(cat "linux-appimage/${LINUX_FILENAME}.sig")
                  jq -n \
                    --arg version "${{ steps.ver.outputs.version }}" \
                    --arg notes "" \
                    --arg pub_date "$DATE" \
                    --arg win_sig "$WIN_SIG" \
                    --arg win_url "https://github.com/modrexio/modrex/releases/download/$TAG/$WIN_FILENAME" \
                    --arg linux_sig "$LINUX_SIG" \
                    --arg linux_url "https://github.com/modrexio/modrex/releases/download/$TAG/$LINUX_FILENAME" \
                    '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $win_sig, url: $win_url}, "linux-x86_64": {signature: $linux_sig, url: $linux_url}}}' \
                    > latest.json

            # compat: serves Electron clients still on electron-updater
            - name: Generate latest.yml and latest-linux.yml (electron-updater compat)
              run: |
                  VERSION=${{ steps.ver.outputs.version }}
                  DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
                  WIN_EXE=$(ls windows-nsis/*.exe | head -1)
                  WIN_FILENAME=$(basename "$WIN_EXE")
                  WIN_SIZE=$(stat -c %s "$WIN_EXE")
                  WIN_SHA512=$(openssl dgst -sha512 -binary "$WIN_EXE" | base64 -w 0)
                  {
                    echo "version: $VERSION"
                    echo "files:"
                    echo "  - url: $WIN_FILENAME"
                    echo "    sha512: $WIN_SHA512"
                    echo "    size: $WIN_SIZE"
                    echo "path: $WIN_FILENAME"
                    echo "sha512: $WIN_SHA512"
                    echo "releaseDate: '$DATE'"
                  } > latest.yml
                  LINUX_APPIMAGE=$(ls linux-appimage/*.AppImage | head -1)
                  LINUX_FILENAME=$(basename "$LINUX_APPIMAGE")
                  LINUX_SIZE=$(stat -c %s "$LINUX_APPIMAGE")
                  LINUX_SHA512=$(openssl dgst -sha512 -binary "$LINUX_APPIMAGE" | base64 -w 0)
                  {
                    echo "version: $VERSION"
                    echo "files:"
                    echo "  - url: $LINUX_FILENAME"
                    echo "    sha512: $LINUX_SHA512"
                    echo "    size: $LINUX_SIZE"
                    echo "path: $LINUX_FILENAME"
                    echo "sha512: $LINUX_SHA512"
                    echo "releaseDate: '$DATE'"
                  } > latest-linux.yml

            - name: Publish release
              uses: softprops/action-gh-release@v3
              with:
                  name: ${{ github.ref_name }}
                  draft: true
                  body_path: RELEASE_BODY.md
                  files: |
                      windows-nsis/modrex_x86_64.exe
                      linux-deb/modrex_x86_64.deb
                      linux-deb/pd3-mod-manager.deb
                      linux-rpm/modrex_x86_64.rpm
                      linux-rpm/pd3-mod-manager.rpm
                      linux-appimage/modrex_x86_64.AppImage
                      latest.json
                      latest.yml
                      latest-linux.yml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
