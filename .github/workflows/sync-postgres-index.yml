name: Sync Postgres index listings

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: sync-postgres-index
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 10.32.1

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply Postgres schema migrations
              env:
                  INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
              run: pnpm --dir apps/index migrate:postgres

            - name: Verify Postgres game catalog
              env:
                  INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
              run: pnpm --dir apps/index verify:postgres-catalog

            - name: Sync ModWorkshop listings
              env:
                  INDEX_DATABASE_URL: ${{ secrets.INDEX_DATABASE_URL }}
              run: pnpm --dir apps/index sync:postgres-listings
