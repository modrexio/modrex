name: Translation Status

on:
    push:
        branches: [main]
        paths:
            - 'apps/desktop/src/renderer/src/i18n/*.json'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: translation-status
    cancel-in-progress: true

jobs:
    update-readme:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Update translation status
              run: node apps/desktop/scripts/update-i18n-readme.mjs

            - name: Commit updated table
              run: |
                  git add README.md
                  if git diff --cached --quiet; then
                    echo "Translation table is already current."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "docs: update translation status"
                  git push origin main
