name: Translation Status

on:
    push:
        branches: [main]
        paths:
            - 'apps/desktop/src/renderer/src/i18n/*.json'
            - 'apps/desktop/translation-contributors.generated.json'
            - 'lexmit.config.json'
            - '.github/workflows/translation-status.yml'
    schedule:
        - cron: '17 4 * * 1'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-readme:
        # Keep both versions equal to the lexmit script and the @shulha/lexmit dependency in
        # apps/desktop/package.json, so the bot writes exactly what the local commands check.
        uses: ShulhaOleh/lexmit/.github/workflows/translation-status.yml@v0.1.0
        permissions:
            contents: write
        with:
            lexmit-version: 0.1.0
        secrets:
            # The main ruleset exempts this deploy key, because it cannot exempt the workflow token.
            push-key: ${{ secrets.MAIN_PUSH_KEY }}
