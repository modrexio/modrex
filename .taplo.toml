# Game manifests and the starter manifest they are copied from are TOML 1.1; Taplo implements
# 1.0 and reports the multiline inline tables as syntax errors. Remove these exclusions once the
# supported language server parses TOML 1.1.
exclude = [
    "**/apps/desktop/src-tauri/src/games/*/package.toml",
    "**/docs/reference/package.example.toml",
]
