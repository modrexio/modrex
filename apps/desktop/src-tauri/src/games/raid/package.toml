id = "raid"
name = "RAID: World War II"
short_name = "RAID"
mod_metadata = "diesel"

graphics_config = {
    filename = "renderer_settings_dx11.xml",
    locations = [
        {
            root = "windows_local_app_data",
            store = "steam",
            path = ["RAID WW2", "renderer_settings_dx11.xml"],
        },
    ],
}

sources = [
    {
        provider = "modworkshop",
        game_id = "543",
    },
]

install = {
    executables = ["raid_win64_release.exe"],
    processes = ["raid_win64_release"],
    stores = [
        {
            provider = "steam",
            app_id = 414740,
            folder = "RAID World War II",
        },
    ],
}

loaders = [
    {
        kind = "raid_superblt",
        modworkshop_ids = [49744],
    },
]

targets = [
    {
        tag = "mods",
        label = "mods",
        primary = true,
        path = ["mods"],
        backup = ["mods.bak"],
        activation = "filesystem",
        load_order = "none",

        unit = {
            kind = "directory",
            ignore_preset = "diesel_infra",

            discovery = {
                policy = "all_directories",
            },
        },
    },
]
