id = "ron"
name = "Ready or Not"
short_name = "RoN"
mod_metadata = "none"

package_reader = {
    format = "unreal",
    aes_key = "E608A99C1512B955A2D65238A711D54CA988AFB2169D8B98BF5989079F616777",
}

movie_replacement = {
    format = "mp4",
    directory = ["ReadyOrNot", "Content", "Movies"],
    storefronts = ["steam"],
}

unreal_config = {
    roots = [
        {
            root = "windows_local_app_data",
            store = "steam",
            path = ["ReadyOrNot", "Saved", "Config"],
        },
    ],
}

config_presets = {
    format = "unreal_engine_ini",
}

graphics_config = {
    filename = "GameUserSettings.ini",
}

sources = [
    {
        provider = "nexus",
        domain = "readyornot",
        numeric_id = 4205,
    },
]

install = {
    executables = ["ReadyOrNot.exe"],
    processes = ["ReadyOrNotSteam-Win64-Shipping"],
    steam_windows_no_mods_argument = "-paksafemode",
    stores = [
        {
            provider = "steam",
            app_id = 1144200,
            folder = "Ready Or Not",
        },
    ],
}

targets = [
    {
        tag = "paks",
        label = "pak_mods",
        primary = true,
        scope = "unreal_paks",
        path = ["ReadyOrNot", "Content", "Paks"],
        backup = ["ReadyOrNot", "Content", "Paks.mods.bak"],
        activation = "filesystem",
        load_order = "none",
        unit = {
            kind = "file",
            disabled_suffix = ".disabled",
            filename = "archive",
            family = {
                extension = "pak",
                companions = [],
            },
        },
    },
]
